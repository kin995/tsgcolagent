name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Tool API tests (stdlib only)
        run: python -m unittest discover -s tests -p "test_tsgtest_app.py" -v
      - name: Metric tests
        run: python -m pytest tests/test_paper_metrics.py tests/test_public_metrics.py -q
