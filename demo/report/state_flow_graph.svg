<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="测试质量摘要"><style>text{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}.muted{fill:#64748b}.title{fill:#0f172a;font-weight:700}</style><rect width="1200" height="760" rx="24" fill="#f8fafc"/><rect x="34" y="30" width="1132" height="100" rx="18" fill="#0f172a"/><text x="62" y="68" fill="#94a3b8" font-size="14">ValiFixTest &amp; TSGColAgent 测试质量摘要</text><text x="62" y="104" fill="white" font-size="24" font-weight="700">source.py</text><rect x="946" y="58" width="190" height="42" rx="21" fill="#dcfce7"/><text x="1041" y="85" text-anchor="middle" fill="#166534" font-size="16" font-weight="700">质量良好</text><rect x="34" y="156" width="350" height="92" rx="14" fill="white" stroke="#e2e8f0"/><text x="52" y="187" class="muted" font-size="13">行覆盖</text><text x="52" y="226" class="title" font-size="30">100%</text><rect x="412" y="156" width="350" height="92" rx="14" fill="white" stroke="#e2e8f0"/><text x="430" y="187" class="muted" font-size="13">分支覆盖</text><text x="430" y="226" class="title" font-size="30">100%</text><rect x="790" y="156" width="350" height="92" rx="14" fill="white" stroke="#e2e8f0"/><text x="808" y="187" class="muted" font-size="13">断言有效性</text><text x="808" y="226" class="title" font-size="30">90%</text><rect x="34" y="268" width="350" height="92" rx="14" fill="white" stroke="#e2e8f0"/><text x="52" y="299" class="muted" font-size="13">变异检出</text><text x="52" y="338" class="title" font-size="30">50%</text><rect x="412" y="268" width="350" height="92" rx="14" fill="white" stroke="#e2e8f0"/><text x="430" y="299" class="muted" font-size="13">TIR</text><text x="430" y="338" class="title" font-size="30">100%</text><rect x="790" y="268" width="350" height="92" rx="14" fill="white" stroke="#e2e8f0"/><text x="808" y="299" class="muted" font-size="13">AvgExec</text><text x="808" y="338" class="title" font-size="30">未执行</text><text x="34" y="405" class="title" font-size="18">证据链路</text><text x="34" y="430" class="muted" font-size="13">从源码结构、测试用例、断言、运行状态到变异样本的证据数量。</text><rect x="34" y="456" width="208" height="92" rx="14" fill="#eef2ff" stroke="#c7d2fe"/><text x="50" y="486" fill="#4338ca" font-size="14" font-weight="700">分析代码</text><text x="50" y="524" class="title" font-size="26">5<tspan font-size="13" class="muted"> 程序节点</tspan></text><rect x="260" y="456" width="208" height="92" rx="14" fill="#eef2ff" stroke="#c7d2fe"/><text x="276" y="486" fill="#4338ca" font-size="14" font-weight="700">执行测试</text><text x="276" y="524" class="title" font-size="26">6<tspan font-size="13" class="muted"> 测试用例</tspan></text><rect x="486" y="456" width="208" height="92" rx="14" fill="#eef2ff" stroke="#c7d2fe"/><text x="502" y="486" fill="#4338ca" font-size="14" font-weight="700">检查结果</text><text x="502" y="524" class="title" font-size="26">6<tspan font-size="13" class="muted"> 断言</tspan></text><rect x="712" y="456" width="208" height="92" rx="14" fill="#eef2ff" stroke="#c7d2fe"/><text x="728" y="486" fill="#4338ca" font-size="14" font-weight="700">记录运行</text><text x="728" y="524" class="title" font-size="26">12<tspan font-size="13" class="muted"> 运行状态</tspan></text><rect x="938" y="456" width="208" height="92" rx="14" fill="#eef2ff" stroke="#c7d2fe"/><text x="954" y="486" fill="#4338ca" font-size="14" font-weight="700">注入缺陷</text><text x="954" y="524" class="title" font-size="26">4<tspan font-size="13" class="muted"> 变异样本</tspan></text><text x="34" y="602" class="title" font-size="18">最需要关注的函数</text><text x="34" y="626" class="muted" font-size="13">以下函数仍有未覆盖或测试证据不足的情况。</text><rect x="34" y="650" width="1132" height="28" rx="8" fill="white"/><circle cx="52" cy="664" r="5" fill="#16a34a"/><text x="68" y="669" class="title" font-size="13">absolute_value</text><text x="770" y="669" class="muted" font-size="12">第 4 行</text><text x="920" y="669" fill="#16a34a" font-size="12" font-weight="700">已覆盖</text><text x="1060" y="669" class="muted" font-size="12">存在存活变异；结构边证据不足</text></svg>